[project]
name = "project-destiny"
version = "0.1.0"
description = "Bazi RAG system — rules-first, grounded generation on PostgreSQL + pgvector"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "openai>=1.40",
  "anthropic>=0.39",
  "typer>=0.12",
  "rich>=13.7",
  "lunar-python>=1.4.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
destiny = "destiny.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/destiny"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
